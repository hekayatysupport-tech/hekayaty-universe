<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Cosmic Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1A0B36"/>
      <stop offset="60%" stop-color="#0B051D"/>
      <stop offset="100%" stop-color="#04020A"/>
    </radialGradient>

    <!-- Outer Magical Glowing Aura -->
    <filter id="magicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cyan/Teal Cosmic Glow -->
    <radialGradient id="cyanGlow" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Purple/Magenta Glow -->
    <radialGradient id="purpleGlow" cx="60%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Feather Plume Main Gradient -->
    <linearGradient id="featherGrad" x1="120" y1="80" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="25%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="80%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Gold Edge Highlight -->
    <linearGradient id="goldEdge" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFE600"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Spine / Quill Core Glow -->
    <linearGradient id="spineGrad" x1="100" y1="420" x2="400" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>

  <!-- Dark Cosmic Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#spaceBg)"/>

  <!-- Border Highlight -->
  <rect width="504" height="504" x="4" y="4" rx="108" stroke="url(#featherGrad)" stroke-width="4" stroke-opacity="0.4" fill="none"/>

  <!-- Ambient Magic Aura Behind Feather -->
  <circle cx="280" cy="220" r="160" fill="url(#cyanGlow)"/>
  <circle cx="200" cy="300" r="180" fill="url(#purpleGlow)"/>

  <g filter="url(#magicGlow)">
    <!-- Feather Backing Silhouette for crisp depth -->
    <path d="M120 410 C140 370 170 300 200 230 C220 180 250 120 320 80 C360 55 410 45 425 45 C425 65 410 115 375 160 C330 220 270 290 220 350 C180 400 145 425 120 410 Z" fill="#090518" opacity="0.6"/>

    <!-- Main Feather Plume Outer Layer (Dynamic Vanes) -->
    <!-- Top Right Vanes -->
    <path d="M425 45 C380 75 320 125 270 185 C285 160 330 110 380 75 Z" fill="url(#goldEdge)"/>
    <path d="M375 160 C320 220 260 280 210 345 C230 305 285 240 340 180 Z" fill="url(#featherGrad)"/>

    <!-- Feather Main Body Fluid Arc -->
    <path d="M125 405 C145 365 180 295 215 225 C240 170 280 100 370 65 C410 50 425 45 425 45 C425 45 395 100 350 160 C295 235 230 320 175 385 C150 415 130 415 125 405 Z" fill="url(#featherGrad)"/>

    <!-- Left Flaring Vanes (Stylized Magic Whisps) -->
    <path d="M215 225 C185 245 150 265 125 270 C145 255 180 240 205 230 Z" fill="url(#goldEdge)"/>
    <path d="M180 295 C150 315 120 335 95 340 C115 325 150 310 175 300 Z" fill="#00F0FF"/>
    <path d="M260 155 C230 175 190 190 160 195 C185 180 220 165 245 158 Z" fill="#F472B6"/>

    <!-- Central Glowing Spine (Rachis & Quill) -->
    <path d="M100 440 C140 390 190 310 240 220 C290 130 350 70 430 40" stroke="url(#spineGrad)" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M100 440 C140 390 190 310 240 220 C290 130 350 70 430 40" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Magic Sparks / Stardust Stars -->
    <!-- Star 1 Top Right -->
    <path d="M430 100 L434 115 L449 119 L434 123 L430 138 L426 123 L411 119 L426 115 Z" fill="#FFFFFF"/>
    <!-- Star 2 Center Glow -->
    <path d="M290 140 L293 150 L303 153 L293 156 L290 166 L287 156 L277 153 L287 150 Z" fill="#00F0FF"/>
    <!-- Star 3 Bottom Quill -->
    <path d="M140 340 L143 348 L151 351 L143 354 L140 362 L137 354 L129 351 L137 348 Z" fill="#FFE600"/>

    <!-- Floating Sparkle Orbs -->
    <circle cx="390" cy="180" r="5" fill="#FFFFFF"/>
    <circle cx="340" cy="240" r="4" fill="#00F0FF"/>
    <circle cx="250" cy="110" r="6" fill="#F472B6"/>
    <circle cx="170" cy="230" r="4" fill="#FFE600"/>
    <circle cx="210" cy="380" r="5" fill="#38BDF8"/>
  </g>
</svg>
