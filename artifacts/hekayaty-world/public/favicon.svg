<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#0D0D1A"/>
  <!-- Gold ring accent -->
  <circle cx="90" cy="90" r="72" stroke="url(#goldRing)" stroke-width="4" fill="none" opacity="0.6"/>
  <!-- Arabic letter ح (Haa) for Hekayaty -->
  <text
    x="90"
    y="115"
    font-family="'Amiri', 'Noto Naskh Arabic', 'Arabic Typesetting', serif"
    font-size="90"
    font-weight="700"
    text-anchor="middle"
    fill="url(#goldGrad)"
  >ح</text>
  <defs>
    <linearGradient id="goldGrad" x1="50" y1="40" x2="130" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#C8720A"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#C8720A"/>
    </linearGradient>
  </defs>
</svg>
